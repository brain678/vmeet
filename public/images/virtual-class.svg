<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Main interface background -->
  <rect x="50" y="50" width="700" height="400" rx="20" fill="#252A41"/>
  
  <!-- Video grid -->
  <g transform="translate(70,70)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="200" height="150" rx="10" fill="#1C1F2E"/>
    <rect x="220" y="0" width="200" height="150" rx="10" fill="#1C1F2E"/>
    <rect x="440" y="0" width="200" height="150" rx="10" fill="#1C1F2E"/>
    
    <!-- Row 2 -->
    <rect x="0" y="170" width="200" height="150" rx="10" fill="#1C1F2E"/>
    <rect x="220" y="170" width="200" height="150" rx="10" fill="#1C1F2E"/>
    <rect x="440" y="170" width="200" height="150" rx="10" fill="#1C1F2E"/>
  </g>
  
  <!-- Controls bar -->
  <rect x="50" y="470" width="700" height="80" rx="10" fill="#252A41"/>
  
  <!-- Control buttons -->
  <circle cx="90" cy="510" r="20" fill="#0E78F9"/>
  <circle cx="150" cy="510" r="20" fill="#0E78F9"/>
  <circle cx="210" cy="510" r="20" fill="#0E78F9"/>
  
  <!-- Chat input -->
  <rect x="270" y="495" width="400" height="30" rx="15" fill="#1C1F2E"/>
  
  <!-- Decorative elements -->
  <g fill="#ffffff" fill-opacity="0.1">
    <circle cx="700" cy="100" r="40"/>
    <circle cx="100" cy="400" r="30"/>
  </g>
</svg>
