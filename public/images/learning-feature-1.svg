<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .primary { fill: #4F46E5; }
    .secondary { fill: #9333EA; }
    .accent { fill: #ffffff; }
  </style>
  <!-- Virtual classroom illustration with students -->
  <rect x="50" y="50" width="300" height="200" rx="10" class="primary" opacity="0.1"/>
  <circle cx="200" cy="120" r="40" class="secondary" opacity="0.2"/>
  <path d="M180 160 h40 v30 h-40z" class="accent" opacity="0.3"/>
  <!-- Add more educational elements -->
  <g transform="translate(120,90)">
    <rect x="0" y="0" width="160" height="100" rx="5" class="primary" opacity="0.15"/>
    <circle cx="80" cy="30" r="15" class="accent"/>
    <rect x="20" y="60" width="120" height="5" class="accent" opacity="0.5"/>
    <rect x="20" y="75" width="100" height="5" class="accent" opacity="0.5"/>
  </g>
</svg>
